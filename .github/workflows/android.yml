name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Runner-ul GitHub are deja Android SDK (ANDROID_HOME). Nu mai folosim
      # android-actions/setup-android, care esueaza cu "Failed to find package 'tools'".
      - name: Install SDK packages (NDK, platform, build-tools)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;29.0.13846066" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Show the errors (if the build failed)
        if: failure()
        run: |
          echo "=============== ERORI ==============="
          grep -n -B2 -A12 -E "FAILED|What went wrong|error:|e: " build.log | head -150 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: MultiCloner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
