name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK command line tools
        shell: bash
        run: |
          set -eux

          mkdir -p "$ANDROID_SDK_ROOT"

          cd "$ANDROID_SDK_ROOT"

          curl -fL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf cmdline-tools
          unzip -q cmdline-tools.zip

          # Google extracts to .../cmdline-tools, or a versioned folder.
          # Normalize it to $ANDROID_SDK_ROOT/cmdline-tools/latest
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/bin" ]; then
            echo "cmdline-tools already extracted in expected layout"
          else
            if [ -d "$ANDROID_SDK_ROOT/cmdline-tools-linux-11076708" ]; then
              mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
              mv "$ANDROID_SDK_ROOT/cmdline-tools-linux-11076708" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            else
              echo "Unexpected extracted layout. Listing SDK root:"
              find "$ANDROID_SDK_ROOT" -maxdepth 2 -type d | sort
              exit 1
            fi
          fi

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066" "cmdline-tools;latest"

      - name: Build debug APK
        shell: bash
        run: |
          set -eux
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MultiCloner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
